name: Busca de vagas

on:
  schedule:
    - cron: '13 12 * * 1-5'
  workflow_dispatch:
    inputs:
      user_id:
        description: Compatibilidade com solicitação anterior
        required: false
        type: string
      run_id:
        description: Execução registrada no painel
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: busca-vagas-${{ inputs.run_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: bot-engine
      - run: npx playwright install chromium --with-deps
        working-directory: bot-engine
      - name: Buscar vagas
        working-directory: bot-engine
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          AUTOMATION_RUN_ID: ${{ inputs.run_id }}
        run: node cloud-discovery.js
