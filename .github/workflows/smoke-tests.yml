name: Post-Deploy Smoke Tests

on:
  workflow_dispatch:
    inputs:
      vercel_url:
        description: 'Vercel deployment URL'
        required: true
        default: 'https://autocurriculo-ai.vercel.app'
  workflow_run:
    workflows: ["Busca de vagas"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke-${{ github.event.inputs.vercel_url || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        env:
          VERCEL_URL: ${{ github.event.inputs.vercel_url || 'https://autocurriculo-ai.vercel.app' }}
        run: |
          echo "Running smoke tests against $VERCEL_URL"
          node tests/smoke.js "$VERCEL_URL"

      - name: Report failure
        if: failure()
        run: |
          echo "Smoke tests failed! Check the Vercel deployment logs."
          exit 1
